name: Publish Provider Package

on:
  workflow_dispatch:
    inputs:
      cleanup-disk:
        description: Whether or not perform a disk cleanup in the runner
        default: true
        type: boolean
        required: false
      version:
        description: Version string to use while publishing the package (e.g. v1.0.0-alpha.1)
        default: ""
        required: false

permissions: {}

jobs:
  get-go-version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract Go version from go.mod
        id: extract-version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          echo "version=${GO_VERSION}" | tee -a "$GITHUB_OUTPUT"

  publish-provider-package:
    needs: get-go-version
    permissions:
      contents: read
      packages: write
    uses: crossplane-contrib/provider-workflows/.github/workflows/publish-provider.yml@451c4dc6ad3691b0a702a997a0ac24e8bbc8bbaa # main
    with:
      cleanup-disk: ${{ inputs.cleanup-disk }}
      go-version: ${{ needs.get-go-version.outputs.go-version }}
      repository: provider-kafka
      version: ${{ github.event.inputs.version }}
    secrets:
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}
      XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_TOKEN }}

  add-extensions:
    needs:
      - get-go-version
      - publish-provider-package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Login to Upbound
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}
      - name: Append extensions
        run: make xpkg.append VERSION="${INPUT_VERSION}"
        env:
          INPUT_VERSION: ${{ inputs.version }}
    env:
      GO_REQUIRED_VERSION: ${{ needs.get-go-version.outputs.go-version }}
      XPKG_MIRROR_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}
      XPKG_MIRROR_TOKEN: ${{ secrets.XPKG_TOKEN }}
